<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E1E38" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="1"/>
    </radialGradient>

    <!-- Neon Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Glowing Cyan Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feGaussianBlur stdDeviation="24" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Inner Shield Dark Gradient -->
    <linearGradient id="innerShieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D192E"/>
      <stop offset="100%" stop-color="#070C18"/>
    </linearGradient>
  </defs>

  <!-- Dark Obsidian Canvas -->
  <rect width="512" height="512" rx="48" fill="url(#bgGlow)"/>

  <!-- Cyber Grid Subtle Lines -->
  <g stroke="#00F0FF" stroke-width="0.75" stroke-opacity="0.12">
    <line x1="64" y1="128" x2="448" y2="128"/>
    <line x1="64" y1="256" x2="448" y2="256"/>
    <line x1="64" y1="384" x2="448" y2="384"/>
    <line x1="128" y1="64" x2="128" y2="448"/>
    <line x1="256" y1="64" x2="256" y2="448"/>
    <line x1="384" y1="64" x2="384" y2="448"/>
  </g>

  <!-- Outer Glowing Shield Ring -->
  <path d="M 256 56 L 416 116 C 416 276 348 392 256 448 C 164 392 96 276 96 116 Z"
        fill="url(#innerShieldGrad)"
        stroke="url(#shieldGrad)"
        stroke-width="10"
        filter="url(#neonGlow)"/>

  <!-- Inner Cyber Contour Shield -->
  <path d="M 256 86 L 390 136 C 390 266 332 366 256 414 C 180 366 122 266 122 136 Z"
        fill="none"
        stroke="#00F0FF"
        stroke-width="2.5"
        stroke-opacity="0.4"
        stroke-dasharray="12 6"/>

  <!-- Futuristic Cyber 'S' Core -->
  <g filter="url(#neonGlow)">
    <!-- Top Arc of S with Circuit Node -->
    <path d="M 330 180 C 330 150 295 136 256 136 C 210 136 180 155 180 190 C 180 230 220 245 264 256 C 310 268 340 286 340 326 C 340 368 305 390 256 390 C 205 390 172 368 170 330"
          fill="none"
          stroke="url(#shieldGrad)"
          stroke-width="24"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Circuit Branch Nodes -->
    <circle cx="180" cy="190" r="7" fill="#00F0FF"/>
    <circle cx="340" cy="326" r="7" fill="#10B981"/>
    <circle cx="264" cy="256" r="6" fill="#FFFFFF"/>
    <line x1="330" y1="180" x2="365" y2="180" stroke="#00F0FF" stroke-width="4"/>
    <circle cx="365" cy="180" r="5" fill="#00F0FF"/>
    <line x1="170" y1="330" x2="135" y2="330" stroke="#10B981" stroke-width="4"/>
    <circle cx="135" cy="330" r="5" fill="#10B981"/>
  </g>

  <!-- Typography at Base -->
  <text x="256" y="475"
        text-anchor="middle"
        font-family="'Segoe UI', 'Ubuntu', sans-serif"
        font-size="28"
        font-weight="900"
        letter-spacing="10"
        fill="#FFFFFF"
        filter="url(#neonGlow)">SECURA</text>
</svg>
