# Calamares Welcome Module Configuration for Secura OS
---
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    true
showDonateUrl:          false

requirements:
    requiredStorage:    20.0
    requiredRam:        3.5
    internetCheckUrl:   http://ftp.debian.org/debian/
    check:
        - storage
        - ram
        - power
        - internet
    required:
        - storage
        - ram

geoip:
    style:    "none"
